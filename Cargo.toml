[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
authors = ["AudioStrada contributors"]

[workspace.dependencies]
audiostrada-core = { path = "crates/audiostrada-core" }
audiostrada-dsp = { path = "crates/audiostrada-dsp" }
audiostrada-engine = { path = "crates/audiostrada-engine" }
audiostrada-io = { path = "crates/audiostrada-io" }
audiostrada-license = { path = "crates/audiostrada-license" }
audiostrada-media = { path = "crates/audiostrada-media" }
audiostrada-midi = { path = "crates/audiostrada-midi" }
audiostrada-plugins = { path = "crates/audiostrada-plugins" }
audiostrada-rt = { path = "crates/audiostrada-rt" }
audiostrada-ui = { path = "crates/audiostrada-ui" }

anyhow = "1.0.104"
base64 = "0.23.1"
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast"] }
clack-extensions = { version = "0.2.0", features = ["clack-host", "audio-ports", "gui", "latency", "log", "params", "posix-fd", "state", "timer", "note-ports"] }
clack-host = "0.2.0"
vst3 = "0.3.0"
libloading = "0.8.9"
midir = "0.11.1"
midly = "0.5.3"
coreaudio-rs = "0.14.2"
assert_no_alloc = { version = "1.1.2", default-features = false, features = ["warn_debug", "warn_release"] }
criterion = "0.8.2"
crossbeam-queue = "0.3.14"
dirs = "7.0.0"
flacenc = "0.5.1"
flate2 = "1.1.10"
tar = "0.4.46"
eframe = "0.37.0"
egui_tiles = "0.18.0"
alsa = "0.12.1"
jack = "0.13.5"
libc = "0.2.191"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSGraphics", "NSResponder", "NSRunningApplication", "NSView", "NSWindow", "NSWorkspace"] }
objc2-audio-toolbox = "0.3.2"
objc2-core-audio = "0.3.2"
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFBundle", "CFData", "CFDictionary", "CFError", "CFNumber", "CFPropertyList", "CFString", "CFURL"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDate", "NSGeometry", "NSRunLoop", "NSString", "NSURL"] }
pipewire = "0.10.1"
rfd = "0.17.2"
raw-window-handle = "0.6.2"
rtrb = "0.4.0"
rubato = "5.0.1"
nam-rs = "0.4.0"
winresource = "0.1.34"
shine-rs = "0.1.5"
opus-rs = "0.1.40"
ogg = "0.9.2"
realfft = "3.5.0"
symphonia = { version = "0.6.1", default-features = false, features = ["aac", "adpcm", "aiff", "alac", "caf", "flac", "isomp4", "mkv", "mp2", "mp3", "ogg", "pcm", "vorbis", "wav"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
getrandom = "0.3.4"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
ab_glyph = "0.2.32"
ureq = { version = "3.5.0", default-features = false, features = ["gzip"] }
wasapi = "0.26.0"
x11rb = "0.13.2"
windows = "0.62.2"
thiserror = "2.0.21"
tracing = "0.1.44"
toml = "1.1.8"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# Debug builds stay usable for audio: dependencies and the signal processing crates are
# optimized, the rest keeps fast builds and full debugging.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.audiostrada-media]
opt-level = 3

[profile.dev.package.audiostrada-dsp]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# Packages and installers: no debug info, stripped.
[profile.dist]
inherits = "release"
debug = false
strip = true

[profile.bench]
inherits = "release"
debug = true
